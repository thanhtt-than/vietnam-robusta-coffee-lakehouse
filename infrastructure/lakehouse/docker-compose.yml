name: tlcn-lakehouse

services:
  nessie-db:
    image: postgres:16
    container_name: tlcn-nessie-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nessie
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: ${NESSIE_DB_PASSWORD:?Set NESSIE_DB_PASSWORD}
    volumes:
      - nessie_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessie -d nessie"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - lakehouse

  nessie:
    image: ghcr.io/projectnessie/nessie:0.108.8
    container_name: tlcn-nessie
    restart: unless-stopped
    depends_on:
      nessie-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:19120:19120"
    environment:
      NESSIE_VERSION_STORE_TYPE: JDBC2
      NESSIE_VERSION_STORE_PERSIST_JDBC_DATASOURCE: postgresql
      QUARKUS_DATASOURCE_POSTGRESQL_JDBC_URL: jdbc:postgresql://nessie-db:5432/nessie
      QUARKUS_DATASOURCE_POSTGRESQL_USERNAME: nessie
      QUARKUS_DATASOURCE_POSTGRESQL_PASSWORD: ${NESSIE_DB_PASSWORD}

      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      AWS_REGION: us-east-1

      JAVA_OPTS_APPEND: >-
        -Dnessie.catalog.default-warehouse=warehouse
        -Dnessie.catalog.warehouses.warehouse.location=s3://coffee-lakehouse/iceberg-warehouse/
        -Dnessie.catalog.service.s3.default-options.endpoint=http://minio:9000
        -Dnessie.catalog.service.s3.default-options.region=us-east-1
        -Dnessie.catalog.service.s3.default-options.path-style-access=true
        -Dnessie.catalog.service.s3.default-options.auth-type=APPLICATION_GLOBAL

    networks:
      - lakehouse

  spark:
    image: apache/spark:3.5.1-scala2.12-java17-python3-ubuntu
    container_name: tlcn-spark
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-lc"]
    command: ["sleep infinity"]
    environment:
      HOME: /tmp
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - D:/TLCN:/workspace
    working_dir: /workspace
    networks:
      - lakehouse

volumes:
  nessie_postgres_data:

networks:
  lakehouse:
    external: true
    name: tlcn-lakehouse
